name: Build Standalone Play Together AutoFish APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Cài đặt Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Tạo Cấu Trúc Dự Án Android Độc Lập
        run: |
          mkdir -p app/src/main/java/com/kaia/autofish/standalone
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PTAutoFish"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.kaia.autofish.standalone'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kaia.autofish.standalone"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="PT AutoFish Pro"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AutoFishService"
                      android:exported="true"
                      android:foregroundServiceType="mediaProjection"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: 5. Tạo Mã Nguồn Kotlin (Chỉnh Nút Trực Tiếp Trong Game)
        run: |
          cat << 'EOF' > app/src/main/java/com/kaia/autofish/standalone/MainActivity.kt
          package com.kaia.autofish.standalone

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val REQ_MEDIA_PROJECTION = 1001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(48, 48, 48, 48)
                  }

                  val title = TextView(this).apply {
                      text = "🎣 PT AutoFish Pro (Độc Lập)"
                      textSize = 22f
                      setTextColor(Color.parseColor("#38BDF8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }
                  layout.addView(title)

                  val desc = TextView(this).apply {
                      text = "Làm theo 3 bước dưới đây, sau đó mở Play Together và bấm [🎯 CHỈNH NÚT] ngay trên menu nổi để kéo vị trí nút trực tiếp trong game."
                      textSize = 14f
                      setTextColor(Color.parseColor("#CBD5E1"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  }
                  layout.addView(desc)

                  val btnOverlay = Button(this).apply {
                      text = "1. Cấp Quyền Cửa Sổ Nổi (Overlay)"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          } else {
                              Toast.makeText(this@MainActivity, "Đã cấp quyền Cửa sổ nổi!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  layout.addView(btnOverlay)

                  val btnAcc = Button(this).apply {
                      text = "2. Bật Dịch Vụ Tự Chạm (Accessibility)"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                          Toast.makeText(this@MainActivity, "Tìm và bật 'PT AutoFish Pro'", Toast.LENGTH_LONG).show()
                      }
                  }
                  layout.addView(btnAcc)

                  val btnStart = Button(this).apply {
                      text = "3. Bắt Đầu Quét Màn Hình & Hiện Menu"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(this@MainActivity, "Vui lòng bật Bước 1 trước!", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }
                          if (AutoFishService.instance == null) {
                              Toast.makeText(this@MainActivity, "Vui lòng bật Bước 2 (Accessibility) trước!", Toast.LENGTH_LONG).show()
                              return@setOnClickListener
                          }
                          val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                          startActivityForResult(mpm.createScreenCaptureIntent(), REQ_MEDIA_PROJECTION)
                      }
                  }
                  layout.addView(btnStart)

                  setContentView(layout)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_MEDIA_PROJECTION && resultCode == RESULT_OK && data != null) {
                      AutoFishService.instance?.startCapture(resultCode, data)
                      Toast.makeText(this, "Đã bật Menu Nổi! Hãy mở game Play Together.", Toast.LENGTH_LONG).show()
                      moveTaskToBack(true)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/kaia/autofish/standalone/AutoFishService.kt
          package com.kaia.autofish.standalone

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.random.Random

          class AutoFishService : AccessibilityService() {
              companion object {
                  var instance: AutoFishService? = null
              }

              private lateinit var wm: WindowManager
              private lateinit var prefs: SharedPreferences
              private val handler = Handler(Looper.getMainLooper())

              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null

              private var isRunning = false
              private var isCalibrating = false
              private var autoRepair = true
              private var state = "IDLE"
              private var castCount = 0
              private var repairEvery = 15

              private var screenW = 2400
              private var screenH = 1080
              private var screenDensity = 320

              private var roiX = 1100
              private var roiY = 220
              private var roiW = 200
              private var roiH = 220

              private val ptX = IntArray(5)
              private val ptY = IntArray(5)
              private val ptLabels = arrayOf("#1 Câu", "#2 Lưu", "#3 Balo", "#4 Sửa", "#5 OK")

              private var panelView: LinearLayout? = null
              private var roiView: View? = null
              private var resizeHandleView: TextView? = null
              private val markerViews = arrayOfNulls<TextView>(5)
              private var tvStatus: TextView? = null
              private var btnToggle: TextView? = null
              private var btnCalib: TextView? = null
              private var btnRepair: TextView? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  prefs = getSharedPreferences("pt_autofish_prefs", Context.MODE_PRIVATE)
                  val dm = resources.displayMetrics
                  screenW = max(dm.widthPixels, dm.heightPixels)
                  screenH = min(dm.widthPixels, dm.heightPixels)
                  screenDensity = dm.densityDpi
                  loadCoordinates()
              }

              private fun loadCoordinates() {
                  roiX = prefs.getInt("roiX", (screenW * 0.45f).toInt())
                  roiY = prefs.getInt("roiY", (screenH * 0.20f).toInt())
                  roiW = prefs.getInt("roiW", 180)
                  roiH = prefs.getInt("roiH", 200)

                  val defX = floatArrayOf(0.84f, 0.72f, 0.93f, 0.35f, 0.50f)
                  val defY = floatArrayOf(0.75f, 0.80f, 0.55f, 0.72f, 0.68f)
                  for (i in 0..4) {
                      ptX[i] = prefs.getInt("ptX_$i", (screenW * defX[i]).toInt())
                      ptY[i] = prefs.getInt("ptY_$i", (screenH * defY[i]).toInt())
                  }
              }

              private fun saveCoordinates() {
                  prefs.edit().apply {
                      putInt("roiX", roiX)
                      putInt("roiY", roiY)
                      putInt("roiW", roiW)
                      putInt("roiH", roiH)
                      for (i in 0..4) {
                          putInt("ptX_$i", ptX[i])
                          putInt("ptY_$i", ptY[i])
                      }
                      apply()
                  }
              }

              fun startCapture(resultCode: Int, data: Intent) {
                  startForegroundNotification()
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection?.stop()
                  mediaProjection = mpm.getMediaProjection(resultCode, data)
                  mediaProjection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          isRunning = false
                      }
                  }, handler)

                  setupVirtualDisplay()
                  showFloatingOverlays()
              }

              private fun startForegroundNotification() {
                  val channelId = "autofish_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "PT AutoFish Service", NotificationManager.IMPORTANCE_LOW)
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(channel)
                  }
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                  } else {
                      Notification.Builder(this)
                  }
                  val notif = builder
                      .setContentTitle("PT AutoFish Pro đang chạy")
                      .setContentText("Chạm CHỈNH NÚT trên màn hình để căn chỉnh")
                      .setSmallIcon(android.R.drawable.sym_def_app_icon)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              private fun setupVirtualDisplay() {
                  val dm = resources.displayMetrics
                  screenW = dm.widthPixels
                  screenH = dm.heightPixels
                  imageReader?.close()
                  imageReader = ImageReader.newInstance(screenW, screenH, PixelFormat.RGBA_8888, 2)
                  virtualDisplay?.release()
                  virtualDisplay = mediaProjection?.createVirtualDisplay(
                      "PTAutoFishCap",
                      screenW, screenH, screenDensity,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader?.surface, null, handler
                  )
              }

              private fun overlayFlags(touchable: Boolean): Int {
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                  if (!touchable) flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  return flags
              }

              private fun showFloatingOverlays() {
                  if (panelView != null) return

                  // 1. Khung ROI [!]
                  val roiBox = TextView(this).apply {
                      text = "ROI [!]"
                      textSize = 10f
                      setTextColor(Color.parseColor("#10B981"))
                      gravity = Gravity.TOP or Gravity.START
                      setPadding(8, 4, 8, 4)
                      background = GradientDrawable().apply {
                          setColor(Color.argb(35, 16, 185, 129))
                          setStroke(4, Color.parseColor("#10B981"))
                          cornerRadius = 8f
                      }
                  }
                  val roiParams = WindowManager.LayoutParams(
                      roiW, roiH,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      overlayFlags(false),
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = roiX
                      y = roiY
                  }
                  wm.addView(roiBox, roiParams)
                  roiView = roiBox

                  // Nút kéo giãn góc dưới phải của ROI
                  val resizeBtn = TextView(this).apply {
                      text = "↘"
                      textSize = 14f
                      setTextColor(Color.BLACK)
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#10B981"))
                          cornerRadius = 20f
                      }
                  }
                  val resizeParams = WindowManager.LayoutParams(
                      64, 64,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      overlayFlags(true),
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = roiX + roiW - 32
                      y = roiY + roiH - 32
                  }
                  wm.addView(resizeBtn, resizeParams)
                  resizeHandleView = resizeBtn

                  // Kéo di chuyển khung ROI
                  roiBox.setOnTouchListener(object : View.OnTouchListener {
                      var startX = 0; var startY = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          if (!isCalibrating) return false
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  startX = roiParams.x; startY = roiParams.y
                                  touchX = e.rawX; touchY = e.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  roiX = startX + (e.rawX - touchX).toInt()
                                  roiY = startY + (e.rawY - touchY).toInt()
                                  roiParams.x = roiX; roiParams.y = roiY
                                  wm.updateViewLayout(roiBox, roiParams)
                                  resizeParams.x = roiX + roiW - 32
                                  resizeParams.y = roiY + roiH - 32
                                  wm.updateViewLayout(resizeBtn, resizeParams)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  // Kéo giãn kích thước khung ROI
                  resizeBtn.setOnTouchListener(object : View.OnTouchListener {
                      var startW = 0; var startH = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  startW = roiW; startH = roiH
                                  touchX = e.rawX; touchY = e.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  roiW = max(90, startW + (e.rawX - touchX).toInt())
                                  roiH = max(90, startH + (e.rawY - touchY).toInt())
                                  roiParams.width = roiW; roiParams.height = roiH
                                  wm.updateViewLayout(roiBox, roiParams)
                                  resizeParams.x = roiX + roiW - 32
                                  resizeParams.y = roiY + roiH - 32
                                  wm.updateViewLayout(resizeBtn, resizeParams)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  // 2. Tạo 5 tâm chạm #1 -> #5
                  val colors = intArrayOf(
                      Color.parseColor("#EF4444"),
                      Color.parseColor("#10B981"),
                      Color.parseColor("#F59E0B"),
                      Color.parseColor("#3B82F6"),
                      Color.parseColor("#EC4899")
                  )
                  for (i in 0..4) {
                      val marker = TextView(this).apply {
                          text = ptLabels[i]
                          textSize = 10f
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          visibility = View.GONE
                          background = GradientDrawable().apply {
                              setColor(colors[i])
                              setStroke(3, Color.WHITE)
                              cornerRadius = 50f
                          }
                      }
                      val mParams = WindowManager.LayoutParams(
                          96, 96,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          overlayFlags(true),
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = ptX[i] - 48
                          y = ptY[i] - 48
                      }
                      marker.setOnTouchListener(object : View.OnTouchListener {
                          var sx = 0; var sy = 0; var tx = 0f; var ty = 0f
                          override fun onTouch(v: View, e: MotionEvent): Boolean {
                              when (e.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      sx = mParams.x; sy = mParams.y
                                      tx = e.rawX; ty = e.rawY
                                      return true
                                  }
                                  MotionEvent.ACTION_MOVE -> {
                                      mParams.x = sx + (e.rawX - tx).toInt()
                                      mParams.y = sy + (e.rawY - ty).toInt()
                                      ptX[i] = mParams.x + 48
                                      ptY[i] = mParams.y + 48
                                      wm.updateViewLayout(marker, mParams)
                                      return true
                                  }
                              }
                              return false
                          }
                      })
                      wm.addView(marker, mParams)
                      markerViews[i] = marker
                  }

                  // 3. Thanh Điều Khiển Nổi
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16, 16, 16, 16)
                      background = GradientDrawable().apply {
                          setColor(Color.argb(230, 15, 23, 42))
                          setStroke(2, Color.parseColor("#38BDF8"))
                          cornerRadius = 20f
                      }
                  }
                  val pParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      overlayFlags(true),
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 30
                      y = 120
                  }

                  val dragHeader = TextView(this).apply {
                      text = "✥ KÉO MENU"
                      textSize = 11f
                      setTextColor(Color.parseColor("#38BDF8"))
                      gravity = Gravity.CENTER
                      setPadding(12, 6, 12, 10)
                  }
                  dragHeader.setOnTouchListener(object : View.OnTouchListener {
                      var sx = 0; var sy = 0; var tx = 0f; var ty = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  sx = pParams.x; sy = pParams.y
                                  tx = e.rawX; ty = e.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  pParams.x = sx + (e.rawX - tx).toInt()
                                  pParams.y = sy + (e.rawY - ty).toInt()
                                  wm.updateViewLayout(panel, pParams)
                                  return true
                              }
                          }
                          return false
                      }
                  })
                  panel.addView(dragHeader)

                  tvStatus = TextView(this).apply {
                      text = "TT: SẴN SÀNG"
                      textSize = 10f
                      setTextColor(Color.parseColor("#A7F3D0"))
                      setPadding(8, 0, 8, 10)
                  }
                  panel.addView(tvStatus)

                  btnToggle = makeBtn("▶ BẬT AUTO", "#10B981") {
                      if (isCalibrating) toggleCalibration(roiParams)
                      isRunning = !isRunning
                      if (isRunning) {
                          btnToggle?.text = "⏹ DỪNG"
                          state = "CASTING"
                          runLoop()
                      } else {
                          btnToggle?.text = "▶ BẬT AUTO"
                          tvStatus?.text = "TT: ĐÃ DỪNG"
                      }
                  }
                  panel.addView(btnToggle)

                  btnCalib = makeBtn("🎯 CHỈNH NÚT", "#F59E0B") {
                      toggleCalibration(roiParams)
                  }
                  panel.addView(btnCalib)

                  btnRepair = makeBtn("🔧 Sửa: BẬT", "#3B82F6") {
                      autoRepair = !autoRepair
                      btnRepair?.text = if (autoRepair) "🔧 Sửa: BẬT" else "🔧 Sửa: TẮT"
                  }
                  panel.addView(btnRepair)

                  wm.addView(panel, pParams)
                  panelView = panel
              }

              private fun makeBtn(label: String, hexColor: String, onClick: () -> Unit): TextView {
                  return TextView(this).apply {
                      text = label
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(18, 12, 18, 12)
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 6, 0, 6) }
                      layoutParams = lp
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(hexColor))
                          cornerRadius = 12f
                      }
                      setOnClickListener { onClick() }
                  }
              }

              private fun toggleCalibration(roiParams: WindowManager.LayoutParams) {
                  isCalibrating = !isCalibrating
                  if (isCalibrating) {
                      isRunning = false
                      btnToggle?.text = "▶ BẬT AUTO"
                      btnCalib?.text = "💾 LƯU NÚT"
                      tvStatus?.text = "KÉO NÚT TRÊN MÀN"
                      roiParams.flags = overlayFlags(true)
                      roiView?.let { wm.updateViewLayout(it, roiParams) }
                      resizeHandleView?.visibility = View.VISIBLE
                      for (m in markerViews) m?.visibility = View.VISIBLE
                  } else {
                      saveCoordinates()
                      btnCalib?.text = "🎯 CHỈNH NÚT"
                      tvStatus?.text = "ĐÃ LƯU TỌA ĐỘ!"
                      roiParams.flags = overlayFlags(false)
                      roiView?.let { wm.updateViewLayout(it, roiParams) }
                      resizeHandleView?.visibility = View.GONE
                      for (m in markerViews) m?.visibility = View.GONE
                  }
              }

              private fun runLoop() {
                  if (!isRunning) return
                  when (state) {
                      "CASTING" -> {
                          tvStatus?.text = "QUĂNG CẦN (#1)"
                          tapPoint(0)
                          state = "WAITING_FISH"
                          handler.postDelayed({ runLoop() }, 1800)
                      }
                      "WAITING_FISH" -> {
                          tvStatus?.text = "ĐANG CANH [!]..."
                          if (detectExclamationMark()) {
                              tvStatus?.text = "⚡ CÁ CẮN! GIẬT!"
                              tapPoint(0)
                              state = "STORING"
                              handler.postDelayed({ runLoop() }, 3600)
                          } else {
                              handler.postDelayed({ runLoop() }, 45)
                          }
                      }
                      "STORING" -> {
                          tvStatus?.text = "BẢO QUẢN (#2)"
                          tapPoint(1)
                          castCount++
                          if (autoRepair && castCount >= repairEvery) {
                              castCount = 0
                              state = "REPAIR_1"
                          } else {
                              state = "CASTING"
                          }
                          handler.postDelayed({ runLoop() }, 1500)
                      }
                      "REPAIR_1" -> {
                          tvStatus?.text = "MỞ BALO (#3)"
                          tapPoint(2)
                          state = "REPAIR_2"
                          handler.postDelayed({ runLoop() }, 1200)
                      }
                      "REPAIR_2" -> {
                          tvStatus?.text = "SỬA CẦN (#4)"
                          tapPoint(3)
                          state = "REPAIR_3"
                          handler.postDelayed({ runLoop() }, 1200)
                      }
                      "REPAIR_3" -> {
                          tvStatus?.text = "XÁC NHẬN (#5)"
                          tapPoint(4)
                          state = "CASTING"
                          handler.postDelayed({ runLoop() }, 1500)
                      }
                  }
              }

              private fun detectExclamationMark(): Boolean {
                  val reader = imageReader ?: return false
                  val image = reader.acquireLatestImage() ?: return false
                  try {
                      val plane = image.planes[0]
                      val buf = plane.buffer
                      val pixelStride = plane.pixelStride
                      val rowStride = plane.rowStride

                      val x0 = roiX.coerceIn(0, image.width - 10)
                      val y0 = roiY.coerceIn(0, image.height - 10)
                      val w = roiW.coerceAtMost(image.width - x0)
                      val h = roiH.coerceAtMost(image.height - y0)

                      var redOrangeTop = 0
                      var redOrangeBot = 0
                      var whiteBg = 0
                      val midY = y0 + (h * 0.62f).toInt()

                      var y = y0
                      while (y < y0 + h) {
                          var x = x0
                          while (x < x0 + w) {
                              val offset = y * rowStride + x * pixelStride
                              if (offset + 2 < buf.limit()) {
                                  val r = buf.get(offset).toInt() and 0xFF
                                  val g = buf.get(offset + 1).toInt() and 0xFF
                                  val b = buf.get(offset + 2).toInt() and 0xFF

                                  // Tầng lọc 1: Nền trắng sáng của hộp thoại [!]
                                  if (r > 215 && g > 215 && b > 210) {
                                      whiteBg++
                                  }
                                  // Tầng lọc 2 & 3: Màu Đỏ/Cam rực của dấu chấm than (Thân trên + Chấm dưới)
                                  if (r > 205 && g in 35..175 && b < 95 && (r - b) > 120) {
                                      if (y < midY) redOrangeTop++ else redOrangeBot++
                                  }
                              }
                              x += 2
                          }
                          y += 2
                      }
                      // Khớp đồng thời: có nền trắng + có nét sổ dọc phía trên + có dấu chấm phía dưới
                      return whiteBg > 35 && redOrangeTop > 14 && redOrangeBot > 4
                  } catch (e: Exception) {
                      return false
                  } finally {
                      image.close()
                  }
              }

              private fun tapPoint(idx: Int) {
                  val tx = (ptX[idx] + Random.nextInt(-6, 7)).toFloat().coerceAtLeast(1f)
                  val ty = (ptY[idx] + Random.nextInt(-6, 7)).toFloat().coerceAtLeast(1f)
                  val path = Path().apply { moveTo(tx, ty) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, Random.nextLong(45, 85))
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF

      - name: 6. Biên Dịch File APK (Gradle AssembleDebug)
        run: gradle assembleDebug --no-daemon

      - name: 7. Xuất File APK Để Tải Về
        uses: actions/upload-artifact@v4
        with:
          name: PT-AutoFish-Standalone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
